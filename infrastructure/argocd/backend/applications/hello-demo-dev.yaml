apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-demo-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ehalilovic700/hello-demo
    targetRevision: main
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: hello-demo-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # The namespace is created by the Crossplane claim from the same PR, possibly
    # after this app first syncs - retry instead of failing permanently.
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
