# App-of-apps: deploys every per-app Argo CD Application that the Backstage
# template writes into infrastructure/argocd/backend/applications/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend-applications
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ehalilovic700/platform-repository.git
    targetRevision: main
    path: infrastructure/argocd/backend/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
