# Backstage: your own app (ghcr.io/ehalilovic700/backstage, built by that repo's CI)
# with the chart's bundled PostgreSQL. Secrets created by hand, never in git
# (GKE-SETUP.md steps 11 and 12e):
#   backstage/backstage-github    key GITHUB_TOKEN
#   backstage/backstage-postgres  keys admin-password, user-password
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backstage
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://backstage.github.io/charts
    chart: backstage
    targetRevision: 2.10.2
    helm:
      releaseName: backstage            # Service: backstage.backstage.svc:7007
      valuesObject:
        backstage:
          image:
            registry: ghcr.io
            repository: ehalilovic700/backstage
            tag: latest                 # new build -> kubectl -n backstage rollout restart deploy/backstage
            pullPolicy: Always
          # Passing any --config disables the image's defaults, so list them explicitly;
          # the chart appends the appConfig below last, so it wins.
          args: ["--config", "app-config.yaml", "--config", "app-config.production.yaml"]
          extraEnvVarsSecrets:
            - backstage-github
          appConfig:
            # HTTPS is required: the frontend uses crypto.randomUUID, which browsers
            # only provide on secure (HTTPS) pages. TLS terminates at the Istio gateway.
            app:
              baseUrl: https://backstage.34.28.253.199.nip.io
            backend:
              baseUrl: https://backstage.34.28.253.199.nip.io
              cors:
                origin: https://backstage.34.28.253.199.nip.io
              database:
                client: pg                         # default division mode: one database per plugin
                                                   # (role 'backstage' has CREATEDB). Don't use
                                                   # pluginDivisionMode: schema - plugins race on
                                                   # migration tables at first start.
                connection:
                  host:
                    $env: POSTGRES_HOST            # POSTGRES_* env vars are injected by the chart
                  port:
                    $env: POSTGRES_PORT
                  user:
                    $env: POSTGRES_USER
                  password:
                    $env: POSTGRES_PASSWORD
            auth:
              providers:
                guest:
                  dangerouslyAllowOutsideDevelopment: true
            integrations:
              github:
                - host: github.com
                  token:
                    $env: GITHUB_TOKEN
            techdocs:                              # build docs in the pod (mkdocs is in the image)
              builder: local
              generator:
                runIn: local
              publisher:
                type: local
            catalog:
              locations:
                - type: url
                  target: https://github.com/ehalilovic700/platform-repository/blob/main/local-k8s-cluster/template.yaml
                  rules:
                    - allow: [Template]
                - type: url
                  target: https://github.com/ehalilovic700/platform-repository/blob/main/catalog/org.yaml
                  rules:
                    - allow: [Group, User]
        postgresql:
          enabled: true
          auth:
            username: backstage
            database: backstage
            existingSecret: backstage-postgres     # fixed password; a generated one would change on every Argo CD sync
          primary:
            persistence:
              size: 2Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: backstage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
