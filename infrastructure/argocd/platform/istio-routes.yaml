# Gateway + VirtualServices in infrastructure/istio that expose Argo CD and Backstage.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-routes
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ehalilovic700/platform-repository.git
    targetRevision: main
    path: infrastructure/istio
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-ingress
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
