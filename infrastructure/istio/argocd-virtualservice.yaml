apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: argocd-server
  namespace: argocd
spec:
  hosts:
    - argocd.34.28.253.199.nip.io
  gateways:
    - istio-ingress/platform-gateway
  tls:
    - match:
        - port: 443
          sniHosts:
            - argocd.34.28.253.199.nip.io
      route:
        - destination:
            host: argocd-server.argocd.svc.cluster.local
            port:
              number: 443
